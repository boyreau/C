name: Code coverage checker
run-name: ${{ gitea.actor }} will ensure your code passes this repository's requirements.
on: [push]

jobs:
  Run-tests-with-coverage:
    container:
      image: gitea:3000/zo/runner:latest
      credentials:
        username: ${{ secrets.DOCKERHUB_GITEA_USERNAME }}
        password: ${{ secrets.DOCKERHUB_GITEA_PASSWORD }}
    steps:
      -
        name: Add my personal gitea to trusted hosts
        run: |
          mkdir -p ~/.ssh || echo 'Creation of ~/.ssh failed'
          echo '[gitea]:2222 ssh-rsa ' >> ~/.ssh/known_hosts || echo 'Couldnt add gitea to trusted hosts'
      -
        name: Check out repository code
      -
        uses: actions/checkout@v4
        with:
          submodules: recursive
          ssh-key: ${{ secrets.SSH_KEY }}
      -
        run: |
          make check
          make stats | jq -c '.data[0].files.[]|del(.segments)|del(.mcdc_records)' > /mnt/coverage/$(date +%Y-%m-%d-%H-%M-%S).json
